<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="160" height="170">
<style>
.fl{animation:f 3.5s ease-in-out infinite}@keyframes f{50%{transform:translateY(-8px)}}
.bl{transform-box:fill-box;transform-origin:center;animation:b 4s infinite}@keyframes b{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.an{animation:a 1.6s ease-in-out infinite}@keyframes a{50%{opacity:.25}}
.sh{transform-box:fill-box;transform-origin:center;animation:s 3.5s ease-in-out infinite}@keyframes s{50%{transform:scale(.8);opacity:.5}}
.pt{opacity:0;animation:t 4s ease-in-out infinite}@keyframes t{0%{transform:translate(0,0);opacity:0}30%{opacity:.9}100%{transform:translate(0,-40px);opacity:0}}
</style>
<ellipse cx="80" cy="158" rx="34" ry="5" fill="#4f7db5" opacity=".35" class="sh"/>
<g class="fl">
<line x1="80" y1="26" x2="80" y2="40" stroke="#8fb8e8" stroke-width="3"/>
<circle cx="80" cy="22" r="6" fill="#6fa3e0" class="an"/>
<rect x="38" y="40" width="84" height="58" rx="18" fill="#dcecfb" stroke="#4f7db5" stroke-width="3"/>
<rect x="48" y="52" width="64" height="34" rx="12" fill="#0b2447"/>
<g class="bl"><circle cx="66" cy="68" r="6" fill="#8fd0ff"/><circle cx="94" cy="68" r="6" fill="#8fd0ff"/></g>
<path d="M70 79 Q80 86 90 79" fill="none" stroke="#8fd0ff" stroke-width="2.5" stroke-linecap="round"/>
<rect x="30" y="58" width="8" height="22" rx="4" fill="#4f7db5"/><rect x="122" y="58" width="8" height="22" rx="4" fill="#4f7db5"/>
<rect x="50" y="102" width="60" height="40" rx="12" fill="#4f7db5"/>
<circle cx="80" cy="122" r="7" fill="#dcecfb"/><circle cx="80" cy="122" r="3" fill="#0b2447" class="an"/>
<rect x="36" y="106" width="12" height="26" rx="6" fill="#6fa3e0"/><rect x="112" y="106" width="12" height="26" rx="6" fill="#6fa3e0"/>
</g>
<circle cx="28" cy="110" r="2.5" fill="#8fb8e8" class="pt"/><circle cx="134" cy="100" r="2" fill="#8fb8e8" class="pt" style="animation-delay:-1.4s"/><circle cx="20" cy="70" r="2" fill="#fff" class="pt" style="animation-delay:-2.6s"/>
</svg>
