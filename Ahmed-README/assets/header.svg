<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
<title>Welcome to Ahmed's GitHub</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6ebf9"/><stop offset=".55" stop-color="#9cc4ea"/><stop offset="1" stop-color="#5b8fc9"/></linearGradient>
<linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc4ea"/><stop offset="1" stop-color="#eaf5ff"/></linearGradient>
<clipPath id="frame"><rect width="900" height="280" rx="12"/></clipPath>
</defs>
<style>
.mono{font-family:'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace}
.tag{font-family:'JetBrains Mono',Consolas,monospace;letter-spacing:5px}
.h1{animation:dr 14s ease-in-out infinite alternate}.h2{animation:dr 10s ease-in-out infinite alternate-reverse}
@keyframes dr{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
.ln{stroke:#1b4f9c;stroke-width:1;opacity:.28;animation:lp 4s ease-in-out infinite}
@keyframes lp{50%{opacity:.6}}
.nd{opacity:.6;animation:np 3s ease-in-out infinite}
@keyframes np{50%{opacity:1;fill:#fff}}
.flow{stroke-dasharray:10 18;animation:fl 3s linear infinite}
@keyframes fl{to{stroke-dashoffset:-84}}
.pulse{animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{opacity:.35}}

.p{opacity:0;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.a{animation-name:fa}.b{animation-name:fb}.c{animation-name:fc}
@keyframes fa{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}85%{opacity:.8}100%{transform:translate(40px,-120px);opacity:0}}
@keyframes fb{0%{transform:translate(0,0);opacity:0}15%{opacity:.8}85%{opacity:.7}100%{transform:translate(-50px,-100px);opacity:0}}
@keyframes fc{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}80%{opacity:.8}100%{transform:translate(10px,-150px);opacity:0}}

</style>
<g clip-path="url(#frame)">
